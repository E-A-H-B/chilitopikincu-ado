    <button onclick="fetchPokemon()" class="button">si</button>
    <div class="grafica">
        <canvas id="miCanva"></canvas>
    </div>
    <script>







        const fetchPokemon = () => {
            const pokeNameInput = document.getElementById("pokeName");
            let pokeName = pokeNameInput.value.toLowerCase();
            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;
            fetch(url)
                .then((res) => {
                    if (res.status !== 200) {
                        console.log(res);
                       
                    } else {
                        return res.json();
                    }
                })
                .then((data) => {
                    if (data) {
                        console.log(data);
                        let pokeImgUrl = data.sprites.front_default;
                        pokeImage(pokeImgUrl);
                        let nameElement = document.getElementById('pokename');
                        nameElement.innerHTML = `Nombre: ${data.forms[0].name}`;
                        let heightElement = document.getElementById('pokeHe');
                        heightElement.innerHTML = `Altura: ${data.height}`;
                        let weightElement = document.getElementById('pokeWe');
                        weightElement.innerHTML = `Peso: ${data.weight}`;
                        let typeElement = document.getElementById('poketype');
                        typeElement.innerHTML = `Tipo: ${data.types.map(type => type.type.name).join(', ')}`;
                        let abilityElement = document.getElementById('pokeitem');
                        abilityElement.innerHTML = `Habilidad: ${data.abilities.map(ability => ability.ability.name).join(', ')}`;
                        let move1Element = document.getElementById('pokemove1');
                        move1Element.innerHTML = `Movimiento 1: ${data.moves[0]?.move?.name || 'N/A'}`;
                        let move2Element = document.getElementById('pokemove2');
                        move2Element.innerHTML = `Movimiento 2: ${data.moves[1]?.move?.name || 'N/A'}`;
                        let move3Element = document.getElementById('pokemove3');
                        move3Element.innerHTML = `Movimiento 3: ${data.moves[2]?.move?.name || 'N/A'}`;
                        let move4Element = document.getElementById('pokemove4');
                        move4Element.innerHTML = `Movimiento 4: ${data.moves[3]?.move?.name || 'N/A'}`;

                        const miCanvas = document.getElementById('miCanva').getContext("2d");
                        if (window.miCanvas === undefined) {
                            window.miCanvas = new Chart(miCanvas, {
                                type: 'bar',
                                data: {
                                    labels: ["HP", "Attack", "Defense", "Special-A", "Special-D", "Speed"],
                                    datasets: [


                                    {
                                        label: `${data.form[0].name}`,
                                        backgroundColor: 'rgba(154,62,35,1)',

                                                data:[`${data.stats[0].base_stat}`,
                                                `${data.stats[1].base_stat}`,
                                                `${data.stats[2].base_stat}`,
                                                `${data.stats[3].base_stat}`,
                                                 `${data.stats[4].base_stat}`,
                                                `${data.stats[5].base_stat}`],
                                        
                                        backgroundColor: [
                                            'rgba(255, 99, 132, 0.2)',
                                            'rgba(54, 162, 235, 0.2)',
                                            'rgba(255, 206, 86, 0.2)',
                                            'rgba(75, 192, 192, 0.2)',
                                            'rgba(153, 102, 255, 0.2)',
                                            'rgba(255, 159, 64, 0.2)'
                                        ],
                                        borderColor: [
                                            'rgba(255, 99, 132, 1)',
                                            'rgba(54, 162, 235, 1)',
                                            'rgba(255, 206, 86, 1)',
                                            'rgba(75, 192, 192, 1)',
                                            'rgba(153, 102, 255, 1)',
                                            'rgba(255, 159, 64, 1)'
                                        ],
                                        borderWidth: 1
                                    }]
                                },
                                options: {
                                    scales: {
                                        y: {
                                            beginAtZero: true
                                        }
                                    }
                                }
                            });
                        } else {
                            window.miCanvas.data.datasets[0].data = data.stats.map(stat => stat.base_stat);
                            window.miCanvas.update();
                        }
                    }
                })
                .catch((error) => {
                    console.error("Hubo un error al buscar el Pokémon:", error);
            
                });
        };

        const pokeImage = (url) => {
            const pokeImg = document.getElementById("pokeImg");
            pokeImg.src = url;
        };
    </script>
